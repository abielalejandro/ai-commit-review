[project]
name = "ai-code-review"
version = "0.1.0"
description = "LangGraph pre-commit code reviewer"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=0.2",
    "langchain-openai>=0.2",
    "langchain-google-genai>=4.0",
    "langchain-anthropic >= 1.5.0",
    "pydantic>=2",
    "pyyaml>=6",
]

[project.scripts]
ai-review = "reviewer.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["reviewer"]
